# Cấu hình riêng cho tier L — giữ nguyên kết quả tier S ở results/ gốc.
#
# Dùng chung lake với tier S (bronze/silver/gold chứa toàn bộ dữ liệu),
# nhưng kết quả analytics ghi vào results/tier_l/ để KHÔNG ghi đè tier S.
#
# Chạy:
#   spark-submit --conf ... /app/src/analytics/run_analytics.py --tier L
#     (với CONFIG_PATH=/app/configs/pipeline-tier-l.yaml)
#
# Hoặc qua make:
#   make analytics TIER=L PIPELINE_CONFIG=/app/configs/pipeline-tier-l.yaml
#   make plots     TIER=L PIPELINE_CONFIG=/app/configs/pipeline-tier-l.yaml

paths:
  raw:         /app/data/raw
  bronze:      /app/data/lake/bronze/events
  silver:      /app/data/lake/silver/events
  quarantine:  /app/data/lake/quarantine/events
  gold:        /app/data/lake/gold
  results:     /app/results/tier_l

tiers:
  L:
    months: ["2019-Oct", "2019-Nov"]

spark:
  shuffle_partitions: 120      # tier L chạy trên Docker VM 16.6 GB, giảm để tránh OOM
  broadcast_threshold_bytes: 10485760
  aqe_enabled: true

cleaning:
  valid_event_types: ["view", "cart", "purchase", "remove_from_cart"]
  session_gap_minutes: 30
  price_min: 0.0

analytics:
  # Dữ liệu tier L kết thúc 2019-11-30 → lấy 2019-12-01 làm mốc recency.
  # (Tier M đang dùng 2019-11-30 trong khi dữ liệu chỉ tới 2019-10-31 — xem
  #  docs/review/m4-review-rfm-m5.md phát hiện #2.)
  rfm_as_of: "2019-12-01"
  kmeans_k_range: [2, 10]
  kmeans_seed: 42
  kmeans_max_iter: 20
