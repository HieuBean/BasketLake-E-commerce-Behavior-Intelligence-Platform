# Isolated tier M paths for M5 benchmarks; preserve the existing tier S lake.
paths:
  raw:         /app/data/raw
  bronze:      /app/data/lake/bronze_m/events
  silver:      /app/data/lake/silver_m/events
  quarantine:  /app/data/lake/quarantine_m/events
  gold:        /app/data/lake/gold_m
  results:     /app/results/tier_m

tiers:
  M:
    months: ["2019-10"]

spark:
  shuffle_partitions: 200
  broadcast_threshold_bytes: 10485760
  aqe_enabled: true

cleaning:
  valid_event_types: ["view", "cart", "purchase", "remove_from_cart"]
  session_gap_minutes: 30
  price_min: 0.0

analytics:
  rfm_as_of: "2019-11-30"
  kmeans_k_range: [2, 10]
  kmeans_seed: 42
  kmeans_max_iter: 20
