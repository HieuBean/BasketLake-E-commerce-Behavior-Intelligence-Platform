# M3 E1 Tier L isolated build configuration. Preparation only: Task06A blocked.
# Never run the default Bronze/Silver paths with --tier L.
paths:
  raw:         /app/data/raw
  bronze:      /app/data/lake/benchmark/e1/tier_l/bronze/events
  silver:      /app/data/lake/benchmark/e1/tier_l/silver/events
  quarantine:  /app/data/lake/benchmark/e1/tier_l/quarantine/events
  gold:        /app/data/lake/benchmark/e1/tier_l/gold
  results:     /app/results/m3/e1/tier_l_build

tiers:
  L:
    months: ["2019-10", "2019-11"]

spark:
  shuffle_partitions: 200
  broadcast_threshold_bytes: 10485760
  aqe_enabled: true

cleaning:
  valid_event_types: ["view", "cart", "purchase", "remove_from_cart"]
  session_gap_minutes: 30
  price_min: 0.0

analytics:
  rfm_as_of: "2019-11-30"
  kmeans_k_range: [2, 10]
  kmeans_seed: 42
  kmeans_max_iter: 20
