# =============================================================================
# Spark standalone cluster: 1 master + 2 workers + History Server
# Image: apache/spark:3.5.4 (chính thức từ Apache)
# =============================================================================

x-spark-common: &spark-common
  image: apache/spark:3.5.4
  user: root                             # quyền ghi vào /app/data/lake
  environment:
    - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-2G}
    - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
    - PYTHONPATH=/app
  volumes:
    - ../:/app                           # mount toàn bộ repo vào /app (bao gồm data/)
    - spark-events:/opt/spark-events
    - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  depends_on:
    - spark-master
  command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]

services:
  spark-master:
    image: apache/spark:3.5.4
    container_name: spark-master
    user: root
    environment:
      - PYTHONPATH=/app
    ports:
      - "8080:8080"    # Spark Master UI
      - "7077:7077"    # Spark submit endpoint
    volumes:
      - ../:/app
      - spark-events:/opt/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--ip", "0.0.0.0", "--port", "7077", "--webui-port", "8080"]

  spark-worker-1:
    <<: *spark-common
    container_name: spark-worker-1
    ports:
      - "8081:8081"

  spark-worker-2:
    <<: *spark-common
    container_name: spark-worker-2
    ports:
      - "8082:8082"

  spark-history:
    image: apache/spark:3.5.4
    container_name: spark-history
    user: root
    environment:
      - SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:///opt/spark-events
    ports:
      - "18080:18080"  # History Server UI
    volumes:
      - spark-events:/opt/spark-events
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]

volumes:
  spark-events:
