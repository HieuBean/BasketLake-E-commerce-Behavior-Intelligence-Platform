# spark-defaults.conf — cấu hình khởi đầu cho cluster
# Tất cả tham số tuning đặt ở đây, KHÔNG hard-code trong mã Python

spark.eventLog.enabled                      true
spark.eventLog.dir                          file:///opt/spark-events
spark.history.fs.logDirectory               file:///opt/spark-events

# AQE — thử bật/tắt ở thí nghiệm E4
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled  true

# Shuffle partitions — thử nhiều giá trị ở E4 (khuyến nghị khởi đầu: 200)
spark.sql.shuffle.partitions                200

# Định dạng Parquet — thử codec khác ở E3
spark.sql.parquet.compression.codec         snappy

# ANSI mode (Spark 4 mặc định bật — giữ để tránh lỗi ẩn)
spark.sql.ansi.enabled                      true

# Broadcast join threshold (bytes) — điều chỉnh ở E4
spark.sql.autoBroadcastJoinThreshold        10485760

# Spark UI
spark.ui.enabled                            true
